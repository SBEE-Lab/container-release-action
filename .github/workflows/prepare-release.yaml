name: Prepare container release

on:
  workflow_call:
    inputs:
      release-id:
        required: false
        type: string
        default: container
      version:
        required: true
        type: string
      source-repository:
        required: true
        type: string
      source-revision:
        required: true
        type: string
      image-repository:
        required: true
        type: string
      staging-reference:
        required: true
        type: string
      image-digest:
        required: true
        type: string
      platforms-json:
        required: false
        type: string
        default: '["linux/amd64"]'
      build-backend:
        required: true
        type: string
      version-policy:
        required: false
        type: string
        default: semver
      build-metadata-json:
        required: false
        type: string
        default: '{}'
      registry-host:
        required: true
        type: string
      registry-username:
        required: true
        type: string
      manifest-path:
        required: false
        type: string
        default: ''
      base-branch:
        required: false
        type: string
        default: main
      environment:
        required: false
        type: string
        default: release
      release-title:
        required: false
        type: string
        default: ''
      attestation-type:
        required: false
        type: string
        default: https://sjanglab.org/attestations/container-release/v1
    secrets:
      registry-password:
        required: true
      app-id:
        required: true
      app-private-key:
        required: true
    outputs:
      release-id:
        description: Validated release stream identifier
        value: ${{ jobs.prepare.outputs.release-id }}
      manifest-path:
        description: Generated release manifest path
        value: ${{ jobs.prepare.outputs.manifest-path }}
      pull-request-number:
        description: Created or updated release pull request number
        value: ${{ jobs.prepare.outputs.pull-request-number }}

permissions:
  contents: read
  id-token: write

concurrency:
  group: container-release-prepare:${{ inputs.release-id }}:${{ inputs.image-repository }}:${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      release-id: ${{ steps.metadata.outputs.release-id }}
      manifest-path: ${{ steps.metadata.outputs.manifest-path }}
      pull-request-number: ${{ steps.pull-request.outputs.pull-request-number }}

    steps:
      - name: Check out caller repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.base-branch }}
          persist-credentials: false

      - name: Check out release action implementation
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .container-release-action
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Log in to container registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ inputs.registry-host }}
          username: ${{ inputs.registry-username }}
          password: ${{ secrets.registry-password }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Verify staging image digest
        id: image
        uses: ./.container-release-action
        with:
          operation: inspect
          image-repository: ${{ inputs.image-repository }}
          staging-reference: ${{ inputs.staging-reference }}
          image-digest: ${{ inputs.image-digest }}

      - name: Prepare release assets directory
        run: rm -rf -- .release-assets && mkdir -- .release-assets

      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ steps.image.outputs.reference }}
          registry-username: ${{ inputs.registry-username }}
          registry-password: ${{ secrets.registry-password }}
          format: spdx-json
          output-file: .release-assets/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate release metadata and provenance
        id: metadata
        uses: ./.container-release-action
        with:
          operation: artifacts
          release-id: ${{ inputs.release-id }}
          version: ${{ inputs.version }}
          source-repository: ${{ inputs.source-repository }}
          source-revision: ${{ inputs.source-revision }}
          image-repository: ${{ inputs.image-repository }}
          staging-reference: ${{ inputs.staging-reference }}
          image-digest: ${{ inputs.image-digest }}
          platforms-json: ${{ inputs.platforms-json }}
          build-backend: ${{ inputs.build-backend }}
          version-policy: ${{ inputs.version-policy }}
          build-metadata-json: ${{ inputs.build-metadata-json }}
          builder-workflow-ref: ${{ job.workflow_ref }}
          builder-workflow-sha: ${{ job.workflow_sha }}
          manifest-path: ${{ inputs.manifest-path }}
          attestation-type: ${{ inputs.attestation-type }}

      - name: Sign and attest staging image
        if: steps.metadata.outputs.release-action == 'update'
        uses: ./.container-release-action
        with:
          operation: sign
          release-id: ${{ inputs.release-id }}
          manifest-path: ${{ steps.metadata.outputs.manifest-path }}

      - name: Generate GitHub App token
        if: steps.metadata.outputs.release-action == 'update'
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open release pull request and enable auto-merge
        if: steps.metadata.outputs.release-action == 'update'
        id: pull-request
        uses: ./.container-release-action
        with:
          operation: prepare-pr
          token: ${{ steps.app-token.outputs.token }}
          release-id: ${{ inputs.release-id }}
          manifest-path: ${{ steps.metadata.outputs.manifest-path }}
          version-policy: ${{ inputs.version-policy }}
          base-branch: ${{ inputs.base-branch }}
          release-title: ${{ inputs.release-title }}

      - name: Docker logout
        if: always()
        run: docker logout "${{ inputs.registry-host }}" || true
